    return ['体を育もう','知を育もう','徳を育もう','才を育もう'].includes(category);
  }
  if(currentCat==='食育栄養アドバイザー') {
    return category==='食育栄養アドバイザー';
  }
  return category===currentCat;
}

function filtered(){
  const nodeOk = new Map();
  for(const n of NODES){
    const ok = allowedLevel(n.level) && allowedCat(n.category, n.type);
    nodeOk.set(n.id, ok);
  }
  // Keep big/mid nodes that match category filter if cat set; if cat is ALL keep all.
  // Links: keep if both ends visible
  const nodesF = NODES.filter(n => nodeOk.get(n.id));
  const ids = new Set(nodesF.map(n=>n.id));
  const linksF = LINKS.filter(l => ids.has(l.source) && ids.has(l.target));
  return {nodesF, linksF};
}

function render(){
  resize();
  svg.selectAll('*').remove();
  const {nodesF, linksF} = filtered();

  // map ids to node objects for simulation
  const nodeById = new Map(nodesF.map(n => [n.id, n]));
  const links = linksF.map(l => ({...l, source: nodeById.get(l.source), target: nodeById.get(l.target)})).filter(l => l.source && l.target);

  const g = svg.append('g');
  const link = g.append('g')
      .attr('stroke-width', d => 1)
    .selectAll('line')
    .data(links)
    .join('line')
      .attr('class', d => 'link ' + (d.type==='related'?'related':''))
      .attr('stroke-width', d => d.weight);

  const node = g.append('g')
    .selectAll('g')
    .data(nodesF)
    .join('g')
      .attr('class', 'node')
      .call(d3.drag()
        .on('start', dragstarted)
        .on('drag', dragged)
        .on('end', dragended));

  node.append('circle')
      .attr('r', d => d.type==='大分類'?18:(d.type==='中分類'?12:9))
      .attr('fill', d => d.color || '#ccc')
      .attr('opacity', d => d.type==='細目'?0.95:0.85);

  node.append('text')
      .attr('x', d => d.type==='大分類'?22:(d.type==='中分類'?16:13))
      .attr('y', 4)
      .text(d => d.type==='細目' ? d.id : d.label);

  node.on('mousemove', (event, d) => {
      tip.style('display','block')
         .style('left', (event.offsetX+12)+'px')
         .style('top', (event.offsetY+12)+'px')
         .html(`<b>${d.id}</b> ${d.label}<br><span style='opacity:.85'>${d.type} / ${d.category} ${d.level?(' / '+d.level):''}</span>`);
  }).on('mouseleave', () => tip.style('display','none'));

  node.on('click', (event, d) => {
    const tags = [d.type, d.category, d.level].filter(Boolean).map(x => `<span class='tag'>${x}</span>`).join('');
    const desc = d.description ? `<div style='margin-top:8px;'>${d.description}</div>` : '';
    const ev = d.evidence ? `<div style='margin-top:8px;'><b>根拠/参考</b><br>${d.evidence}</div>` : '';
    meta.html(`${tags}<div style='margin-top:8px; font-size:14px;'><b>${d.id}</b> ${d.label}</div>${d.type==='細目' ? `<div style='margin-top:6px;'><b>頻出度</b>: ${d.freq||''}</div>`:''}${desc}${ev}`);
  });

  const sim = d3.forceSimulation(nodesF)
    .force('link', d3.forceLink(links).id(d => d.id).distance(d => d.type==='belongs-to'?50:90).strength(d => d.type==='belongs-to'?0.8:0.2))
    .force('charge', d3.forceManyBody().strength(-220))
    .force('center', d3.forceCenter(width/2, height/2))
    .force('collide', d3.forceCollide().radius(d => d.type==='大分類'?24:(d.type==='中分類'?16:12)));

  sim.on('tick', () => {
    link
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);

    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  // zoom
  svg.on('.zoom', null);
  activeZoom = d3.zoom()
    .scaleExtent([0.25, 4])
    .clickDistance(8)
    .tapDistance(12)
    .on('zoom', (event) => { g.attr('transform', event.transform); });
  svg.call(activeZoom).on('dblclick.zoom', null);

  function dragstarted(event, d) {
    if (!event.active) sim.alphaTarget(0.3).restart();
    d.fx = d.x; d.fy = d.y;
  }
  function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
  function dragended(event, d) { if (!event.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }
}

function setMode(mode){
  currentMode = mode;
  document.getElementById('bL1').classList.toggle('active', mode==='L1');
  document.getElementById('bL12').classList.toggle('active', mode==='L12');
  document.getElementById('bAll').classList.toggle('active', mode==='ALL');
  render();
}

document.getElementById('bL1').onclick = () => setMode('L1');
document.getElementById('bL12').onclick = () => setMode('L12');
document.getElementById('bAll').onclick = () => setMode('ALL');

document.getElementById('cat').onchange = (e) => { currentCat = e.target.value; render(); };
document.getElementById('zoomIn').onclick = () => {
  if(activeZoom) svg.transition().duration(180).call(activeZoom.scaleBy, 1.35);
};
document.getElementById('zoomOut').onclick = () => {
  if(activeZoom) svg.transition().duration(180).call(activeZoom.scaleBy, 1/1.35);
};
document.getElementById('zoomReset').onclick = () => {
  if(activeZoom) svg.transition().duration(220).call(activeZoom.transform, d3.zoomIdentity);
};

resize();
render();
</script>
</body>
</html>
